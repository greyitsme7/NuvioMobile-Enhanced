workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
    scripts:
      - name: Build unsigned archive
        script: |
          cd iosApp
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          cd $CM_BUILD_DIR/build
          mkdir Payload
          cp -R iosApp.xcarchive/Products/Applications/*.app Payload/
          zip -r app-unsigned.ipa Payload
    artifacts:
      - build/*.ipa
